name: Milestone pull request

on:
  push:
    branches:
      - "setup/M00"
      - "milestone/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate milestone documentation before opening the PR
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BRANCH" == "setup/M00" ]]; then
            milestone_id="M00"
          elif [[ "$BRANCH" =~ ^milestone/(M[0-9]{2,})-[a-z0-9-]+$ ]]; then
            milestone_id="${BASH_REMATCH[1]}"
          else
            echo "Invalid branch name: $BRANCH" >&2
            exit 1
          fi
          test -f "docs/milestones/${milestone_id}/README.md"
          test -f docs/MILESTONE_TRACKER.md
      - name: Open or update pull request
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const setupMatch = branch === 'setup/M00';
            const match = branch.match(/^milestone\/(M\d{2,})-(.+)$/);
            if (!setupMatch && !match) {
              core.setFailed(`Branch '${branch}' must be setup/M00 or use milestone/Mxx-<description> (for example milestone/M01-first-feature).`);
              return;
            }

            const id = setupMatch ? 'M00' : match[1];
            const slug = setupMatch ? 'workflow-setup' : match[2];
            const titleText = slug.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            const title = `${id}: Implement ${titleText}`;
            const body = [
              `## Milestone ${id}`,
              '',
              `Milestone details and actual validation results: [docs/milestones/${id}/README.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${branch}/docs/milestones/${id}/README.md).`,
              '',
              'Use the repository pull request template for completed work, affected routes/components, validation results, and outstanding issues.',
              '',
              `Source branch: \`${branch}\``,
              'Target branch: `develop`'
            ].join('\n');

            const { owner, repo } = context.repo;
            const head = `${owner}:${branch}`;
            const existing = await github.rest.pulls.list({ owner, repo, state: 'open', head, base: 'develop' });
            if (existing.data.length) {
              const pr = existing.data[0];
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, title, base: 'develop' });
              core.info(`Updated pull request #${pr.number}.`);
            } else {
              const pr = await github.rest.pulls.create({ owner, repo, head: branch, base: 'develop', title, body });
              core.info(`Created pull request #${pr.data.number}.`);
            }
