name: Milestone pull request

on:
  push:
    branches:
      - "frontend/**"
      - "backend/**"
      - "milestone/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update:
    runs-on: ubuntu-latest
    steps:
      - name: Open or update pull request
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const match = branch.match(/^(?:frontend\/(F\d{2})|backend\/(B\d{2})|milestone\/(M\d{2,}))-(.+)$/);
            if (!match) {
              core.setFailed(`Branch '${branch}' must use frontend/Fxx-<description>, backend/Bxx-<description>, or milestone/Mxx-<description>.`);
              return;
            }

            const id = match[1] || match[2] || match[3];
            const slug = match[4];
            const titleText = slug.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            const title = `${id}: Implement ${titleText}`;
            const body = [
              `## Milestone ${id}`,
              '',
              `Implementation notes: [${id} milestone documentation](shoot-frontend/docs/milestones/${id}/README.md)`,
              '',
              'Review the milestone documentation and repository pull request template for completed work, validation results, and outstanding issues.',
              '',
              `Source branch: \`${branch}\``,
              'Target branch: `develop`'
            ].join('\n');

            const { owner, repo } = context.repo;
            const head = `${owner}:${branch}`;
            const existing = await github.rest.pulls.list({ owner, repo, state: 'open', head, base: 'develop' });
            if (existing.data.length) {
              const pr = existing.data[0];
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, title, body, base: 'develop' });
              core.info(`Updated pull request #${pr.number}.`);
            } else {
              const pr = await github.rest.pulls.create({ owner, repo, head: branch, base: 'develop', title, body });
              core.info(`Created pull request #${pr.data.number}.`);
            }
