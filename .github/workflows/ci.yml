name: CI

on:
  push:
    branches: [main, develop, "frontend/**", "backend/**", "milestone/**", "fix/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  repository-structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project layout and workflow documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f shoot-frontend/README.md
          test -f shoot-backend/README.md
          test -f README.md
          test -f docs/git-workflow.md
          test -f docs/milestones/README.md
          test -f .github/pull_request_template.md
      - name: Validate frontend milestone
        if: contains(github.ref, 'frontend/') || github.event_name == 'pull_request'
        run: |
          cd shoot-frontend
          npm test
          npm run build
